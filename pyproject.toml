[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amber-local"
version = "0.1.0"
description = "Local TeslaUSB alert triage with Gemma and FastALPR"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "httpx", "fast-alpr[onnx]", "psutil"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
amber = "amber.cli:main"

[tool.setuptools.package-data]
amber = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

